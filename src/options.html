<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TelePick Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>TelePick</h1>
      <p class="subtitle">Pick selected text and send it as a note to your Telegram chat.</p>
    </header>

    <form id="settings-form">
      <div class="field">
        <label for="bot-token">Bot Token</label>
        <input
          type="password"
          id="bot-token"
          name="botToken"
          placeholder="123456789:ABCdefGHI..."
          autocomplete="off"
          required
        />
        <p class="hint">Create a bot via <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a> and paste the token here.</p>
      </div>

      <div class="field">
        <label for="chat-id">Chat ID</label>
        <input
          type="text"
          id="chat-id"
          name="chatId"
          placeholder="-1001234567890 or 123456789"
          autocomplete="off"
          required
        />
        <p class="hint">Your user ID, group ID, or channel ID. Message your bot first, then use <code>getUpdates</code> or <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a>.</p>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="test-btn" class="btn btn-secondary">Send test message</button>
      </div>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
