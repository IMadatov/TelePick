<style>
        .glass-panel {
            background: rgba(12, 14, 17, 0.95);

        .listening-border {
            position: relative;
        }
        
        .listening-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(90deg, transparent, #2aabee, transparent);
            background-size: 200% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: move-gradient 2s linear infinite;
        }

        @keyframes move-gradient {

        .pulse-text {
            animation: pulse-opacity 1.5s ease-in-out infinite;
        }

        @keyframes pulse-opacity {

</div>
<!-- Content Body -->
<div class="px-6 py-8 flex flex-col items-center justify-center">
<!-- Listening Area -->
<div class="listening-border w-full h-32 rounded-xl bg-surface-container-highest flex items-center justify-center group transition-colors hover:bg-surface-variant/50 cursor-pointer shadow-[0_0_15px_rgba(42,171,238,0.1)]">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl animate-pulse">keyboard</span>
<span class="font-mono-sm text-mono-sm text-primary pulse-text tracking-widest">LISTENING...</span>
</div>
</div>
<!-- Helper Text -->
<p class="font-body-sm text-body-sm text-outline mt-6 text-center max-w-[280px]">
                    Use combinations like <span class="text-on-surface bg-surface-container-high px-1.5 py-0.5 rounded border border-white/10 font-mono-sm">CMD+Shift+C</span> to avoid conflicts with system shortcuts.
                </p>
</div>
<!-- Footer Actions -->
<div class="px-6 py-4 bg-surface-container-low/50 border-t border-white/5 flex justify-end gap-3">
<button class="px-4 py-2 rounded-lg font-headline-md text-headline-md text-on-surface-variant hover:bg-surface-variant/50 transition-colors">
                    Cancel
                </button>
<button class="px-4 py-2 rounded-lg bg-primary-container text-on-primary font-headline-md text-headline-md hover:scale-[0.98] transition-transform shadow-[0_0_10px_rgba(42,171,238,0.2)] disabled:opacity-50 disabled:cursor-not-allowed">
                    Save
                </button>
</div>
</div>
</div>
<script>
        // Simple interaction script to simulate setting a key
        document.addEventListener('DOMContentLoaded', () => {
            const listeningArea = document.querySelector('.listening-border');
            const listeningText = listeningArea.querySelector('span.font-mono-sm');
            const icon = listeningArea.querySelector('.material-symbols-outlined');
            const saveBtn = document.querySelector('button.bg-primary-container');
            
            // Initial disabled state for save button
            saveBtn.disabled = true;

            document.addEventListener('keydown', (e) => {
                e.preventDefault(); // Prevent default browser actions
                
                let keys = [];
                if (e.metaKey) keys.push('CMD');
                if (e.ctrlKey) keys.push('Ctrl');
                if (e.altKey) keys.push('Alt');
                if (e.shiftKey) keys.push('Shift');
                
                // Add the actual key if it's not a modifier
                if (!['Meta', 'Control', 'Alt', 'Shift'].includes(e.key)) {
                    keys.push(e.key.toUpperCase());
                }

                if (keys.length > 0) {
                    listeningText.textContent = keys.join(' + ');
                    listeningText.classList.remove('pulse-text');
                    listeningText.classList.replace('text-primary', 'text-on-surface');
                    
                    listeningArea.classList.remove('listening-border');
                    listeningArea.classList.add('border', 'border-primary-container');
                    
                    icon.textContent = 'check_circle';
                    icon.classList.remove('animate-pulse');
                    icon.classList.replace('text-primary', 'text-tertiary-fixed-dim');

                    saveBtn.disabled = false;
                }
            });
        });
    </script>
