<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TelePick Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>TelePick</h1>
      <p class="subtitle">Pick selected text and send it as a note to your Telegram chat.</p>
    </header>

    <form id="settings-form">
      <div class="field">
        <label for="bot-token">Bot Token</label>
        <input
          type="password"
          id="bot-token"
          name="botToken"
          placeholder="123456789:ABCdefGHI..."
          autocomplete="off"
          required
        />
        <p class="hint">Create a bot via <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a> and paste the token here.</p>
      </div>

      <div class="field">
        <div class="field-row">
          <label>Recipients (max 20)</label>
          <button type="button" id="add-recipient-btn" class="btn btn-secondary btn-sm">+ Add recipient</button>
        </div>
        <div id="recipients-list" class="recipients-list"></div>
        <p class="hint">Add your personal/group chat IDs. For forum groups, add topic IDs under each recipient. Get IDs via <a href="https://t.me/GetChatID_IL_BOT" target="_blank" rel="noopener">@GetChatID_IL_BOT</a>.</p>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="test-btn" class="btn btn-secondary">Send test message</button>
      </div>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
